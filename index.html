<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAV -->
    <div class="nav">
        <div class="container">
            <div class="brand">✈ Travel Agency</div>

            <div class="right">
                <a class="btn">Cambiar tema</a>
            </div>

            <div class="menu">
                <a href="#inicio">Inicio</a>
                <a href="#paquetes">Paquetes</a>
                <a href="#contacto">Contacto</a>
            </div>

        </div>
    </div>

    <!-- BANNER -->
    <div class="banner">
        <!-- <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"> -->
        <h1>Descubre tu proximo destino</h1>
    </div>

    <!-- PAQUETES -->
    <div class="section">
        <div class="container">
            <h2 class="title">Paquetes Turísticos</h2>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
                <div class="body">
                    <h3>París</h3>
                    <div class="price">$900</div> 
                    <div class="btn_card">
                        <a class="btn" href="#">ver más</a>
                    </div>
                </div>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
                <div class="body">
                    <h3>París</h3>
                    <div class="price">$900</div> 
                    <div class="btn_card">
                        <a class="btn" href="#">ver más</a>
                    </div>
                </div>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
                <div class="body">
                    <h3>París</h3>
                    <div class="price">$900</div> 
                    <div class="btn_card">
                        <a class="btn" href="#">ver más</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTACTO -->
    <div class="section">
        <div class="container">
            <h2 class="title">Contáctanos</h2>
            <form class="form" action="#" method="post">
                <div class="row">
                    <input class="input" type="text" placeholder="Nombre">
                </div>
                <div class="row">
                    <input class="input" type="email" placeholder="Email">
                </div>
                <div class="row">
                    <textarea class="textarea" placeholder="Mensaje"></textarea>
                </div>
                <div class="row btn_contacto">
                    <button class="btn">Enviar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
     <div class="footer">
        @2024 travel Agency. Síguenos
        <span class="icons">
            <a href="#">T</a>
            <a href="#">F</a>
            <a href="#">I</a>
        </span>
     </div>

</body>
</html>
